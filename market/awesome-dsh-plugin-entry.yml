url: https://github.com/Making-acid/dsh-approval-preflight
name: Making-acid/dsh-approval-preflight
category: workflow
description:
  en: Replaces per-call approval prompts with a reviewed computation graph. Each node states the semantic operation (download what to where, write what, delete what); the user approves nodes one at a time in a side panel, one approval covers one successful execution, uncovered operations still use the native approval card, and each node keeps an audit trail of what actually ran.
  zh: 把逐次审批换成「先交计算图、用户逐节点批准」：节点写的是这件事的本质（下载什么到哪里、写什么、删什么），批准对一次成功执行生效；未申报的操作仍走原生审批卡，节点内实际跑过什么留有审计痕迹。
icon: https://raw.githubusercontent.com/Making-acid/dsh-approval-preflight/main/assets/icon-180.png
