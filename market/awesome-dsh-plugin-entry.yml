url: https://github.com/Making-acid/dsh-approval-preflight
name: Making-acid/dsh-approval-preflight
category: workflow
description:
  en: Turns per-call approval prompts into one plan-first batch grant. The model publishes a task/permission table, the user grants coarse permission classes once in a side panel, covered approvals resolve instantly, and uncovered ones time out so the model switches to an unblocked subtask while a late click still becomes a standing grant.
  zh: 把逐次审批换成开工前一次批完：模型先交任务与权限表，用户在右侧面板一次性授权若干权限类别；命中类别的审批秒过，未覆盖的审批超时后让模型先做别的子任务，迟到的点击仍会转成常驻授权。
