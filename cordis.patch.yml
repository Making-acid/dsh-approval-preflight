# dsh-approval-preflight bundle patch.
#
# Inserts one Host row: the plugin that owns the preflight plan table, the
# approval interpreter and the side-panel RPC channel, plus one Client row that
# renders the panel and its composer strip.
#
# Every value below is optional; the plugin fills in these defaults. A patch
# replaces the targeted row's whole `config`, so user overrides should keep only
# the fields they actually change.

- insert:
    - id: approval-preflight
      name: dsh-approval-preflight
      config:
        # How long a non-pre-authorized approval may stay unanswered before the
        # plugin lets the model move on. The tool call fails fast with a
        # "waiting for authorization" note instead of blocking the whole turn.
        # Set 0 to restore the old blocking behaviour.
        approvalTimeoutSeconds: 90
        # Permission classes the preflight may ask for. In the default
        # `workspace-write` mode the only interruptions are danger-full-access
        # escalations, so `danger` is included: the panel labels it explicitly and
        # granting it is always one deliberate click. Drop a class here to make
        # that kind of request always fall back to the native approval card.
        enabledClasses:
          - fs-write
          - exec
          - network
          - danger
        # Upper bound on plan-table rows. Larger plans are rejected so a table
        # stays readable in the panel.
        maxTasks: 40
        # Wake the model with a follow-up turn when the user grants a class.
        wakeOnGrant: true
