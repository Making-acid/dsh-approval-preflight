# dsh-approval-preflight bundle patch.
#
# Inserts one Host row: the plugin that owns the computation graph, the node
# approval ledger and the side-panel channel, plus one Client module that renders
# the panel and its composer strip.
#
# Every value below is optional; the plugin fills in these defaults. A patch
# replaces the targeted row's whole `config`, so user overrides should keep only
# the fields they actually change.

- insert:
    - id: approval-preflight
      name: dsh-approval-preflight
      config:
        # How long an approval the running node does not cover may stay unanswered
        # before the plugin lets the model move on. The tool call fails fast with a
        # "not covered by this node" note instead of blocking the turn.
        # Set 0 to restore the old blocking behaviour.
        approvalTimeoutSeconds: 90
        # A running node that never ends is closed automatically after this many
        # seconds. Closing does not consume the approval.
        nodeIdleSeconds: 600
        # Upper bound on computation-graph nodes, so the panel stays readable.
        maxNodes: 80
        # Wake the model with a follow-up turn when the user approves nodes.
        wakeOnGrant: true
